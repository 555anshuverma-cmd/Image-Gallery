 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Explore beautiful moments</p>
    </header>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="city">City</button>
        <button class="filter-btn" data-filter="animals">Animals</button>
    </div>

    <div class="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Nature">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=600" alt="City">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=600" alt="Dog">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600" alt="Sunrise">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?w=600" alt="Architecture">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=600" alt="Lion">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Forest">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=600" alt="City at night">
        </div>

    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="close">&times;</span>
        <button class="prev">&#10094;</button>
        <img id="lightbox-img" src="" alt="Preview">
        <button class="next">&#10095;</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
